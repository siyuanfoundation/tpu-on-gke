# single host TPU slice
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: tpu-v6e-4-single-host
spec:
  priorities:
  - spot: true
    tpu:
      type: tpu-v6e-slice
      count: 4
      topology: 2x2
  nodePoolAutoCreation:
    enabled: true
---
# multihost (2 hosts) TPU slice
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: tpu-v6e-8-multi-host
spec:
  priorities:
  - spot: true
    tpu:
      type: tpu-v6e-slice
      count: 4
      topology: 2x4
  nodePoolAutoCreation:
    enabled: true